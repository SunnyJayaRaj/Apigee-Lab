name: Apigee Proxy CI

# Validates every proxy bundle in this monorepo before merge:
#   1. XML well-formedness across ALL projects (design-time sources)
#   2. OpenAPI spec sanity check
#   3. Bundle assembly exactly as Apigee expects it (tools/build-bundles.sh)
#   4. apigeelint (version-pinned for reproducible builds)
#   5. Secret leak scan
#   6. Packaged, deployable artifacts uploaded for download
#
# NOTE ON DEPLOYMENT: this pipeline intentionally does NOT deploy anywhere —
# there is no live Apigee org wired up yet. See the "deployment-readiness"
# job output for the exact steps to enable real deployments later.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APIGEELINT_VERSION: "2.85.1"

jobs:
  validate-sources:
    name: Validate XML & OpenAPI Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install xmllint (not preinstalled on ubuntu runners)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --version

      - name: XML well-formedness (all projects)
        run: |
          echo "🔍 Checking every XML file parses..."
          find Weather-Shield-Gateway Secure-Bank-Access \
               Retail-Mesh-Orchestrator Shared-Flows-Governance \
               Apigee-DevOps-Pipeline \
               -name '*.xml' -type f -print0 | xargs -0 -n1 xmllint --noout
          echo "✅ All XML files are well-formed."

      - name: OpenAPI specs declare an openapi version
        run: |
          for spec in */01-API-Design/*.yaml; do
            [ -e "$spec" ] || continue
            grep -q '^openapi:' "$spec" \
              || { echo "❌ $spec missing 'openapi:' root key"; exit 1; }
            echo "✅ $spec"
          done

      - name: Policy drift guard (canonical vs governance mirrors)
        run: ./tools/check-drift.sh

      - name: Assemble deployable bundles
        run: ./tools/build-bundles.sh target

      - name: Cache npx packages
        uses: actions/cache@v6
        with:
          path: ~/.npm/_npx
          key: apigeelint-${{ env.APIGEELINT_VERSION }}

      - name: Lint every bundle (apigeelint@${{ env.APIGEELINT_VERSION }})
        run: |
          ARTIFACTS="Weather-Shield-Gateway:apiproxy Secure-Bank-Access:apiproxy Retail-Mesh-Orchestrator:apiproxy Apigee-DevOps-Pipeline:apiproxy Shared-Flows-Demo:apiproxy Shared-Flow-Governance:sharedflowbundle"
          status=0
          for entry in $ARTIFACTS; do
            name="${entry%%:*}"; kind="${entry##*:}"
            echo "🔍 Linting $name ($kind) ..."
            npx --yes "apigeelint@${APIGEELINT_VERSION}" \
              -s "target/$name/$kind" -f table || status=1
          done
          exit $status

      - name: Package deployable bundles
        run: |
          mkdir -p dist
          ARTIFACTS="Weather-Shield-Gateway:apiproxy Secure-Bank-Access:apiproxy Retail-Mesh-Orchestrator:apiproxy Apigee-DevOps-Pipeline:apiproxy Shared-Flows-Demo:apiproxy Shared-Flow-Governance:sharedflowbundle"
          for entry in $ARTIFACTS; do
            name="${entry%%:*}"; kind="${entry##*:}"
            (cd "target/$name" && zip -qr "$OLDPWD/dist/$name.zip" "$kind")
          done
          ls -la dist/

      - name: Upload deployable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apiproxy-bundles
          path: dist/*.zip
          retention-days: 14

  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-readiness:
    name: Deployment Readiness (informational)
    runs-on: ubuntu-latest
    needs: [validate-sources, secret-scan]
    steps:
      - name: How to enable real deployments later
        run: |
          cat <<'EOF'
          ✅ All checks passed — bundles are packaged and deploy-ready.

          This repo currently has NO live Apigee org attached (by design).
          When you create a free Apigee eval org, enable real CD with:

            1. Create service account + grant "Apigee Organization Admin".
            2. Store its JSON key as GitHub secret: APIGEE_SA_KEY
            3. Store org/project names as vars: APIGEE_ORG, APIGEE_PROJECT
            4. Deploy with apigeecli:
                 curl -sSfL https://raw.githubusercontent.com/apigee/apigeecli/master/download.sh | bash -
                 export GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_GHA_CREDS_PATH
                 apigeecli apis create bundle -f <bundle.zip> \
                   -n <proxy-name> --org $APIGEE_ORG --token $(gcloud auth print-access-token)

          Until then, artifacts from this run are fully deployable by hand
          via UI: Apigee console → Proxy Bundles → Upload.
          EOF
