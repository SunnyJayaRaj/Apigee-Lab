name: Apigee CI Pipeline (Simulation Mode)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci-factory:
    name: Build, Lint & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Proxy Bundle
        run: |
          echo "🚧 Building apiproxy folder..."
          mkdir -p apiproxy/proxies

          cp Apigee-DevOps-Pipeline/cicd-proxy.xml apiproxy/
          cp Apigee-DevOps-Pipeline/05-Proxy-Wiring/proxy-endpoint-default.xml apiproxy/proxies/

          echo "✅ Bundle Structure Created."

      - name: Install & Run apigeelint
        run: |
          npm install --global apigeelint

          echo "🔍 Scanning code for errors..."
          apigeelint -s apiproxy/ -f table

      - name: Create Zip Bundle
        run: |
          zip -r apiproxy.zip apiproxy
          echo "📦 Zip bundle created successfully."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployable-bundle
          path: apiproxy.zip

  cd-simulation:
    name: Mock Deployment
    needs: ci-factory
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Cloud Handshake
        run: |
          echo "🔐 Authenticating with Google Cloud... [MOCKED]"
          echo "🚀 Uploading apiproxy.zip to Organization: resonant-amulet... [MOCKED]"
          echo "✅ Deployment Revision 12 Activated. (Simulation)"
